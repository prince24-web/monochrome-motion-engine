name: Render Monochrome Explainer Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion composition ID'
        required: true
        default: 'LeverageTrap'
        type: choice
        options:
          - LeverageTrap
          - ConsistencyBeatsTalent
          - FullOnePercent
          - OpeningDemo
      output_name:
        description: 'Output MP4 filename'
        required: true
        default: 'leverage-trap.mp4'
        type: string
      crf:
        description: 'H.264 CRF quality (lower = higher quality, 16-20 recommended)'
        required: false
        default: '17'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'video-engine/package-lock.json'

      - name: Install dependencies
        working-directory: video-engine
        run: npm ci

      - name: Ensure Remotion headless browser
        working-directory: video-engine
        run: npx remotion browser ensure

      - name: Render MP4 in the cloud
        working-directory: video-engine
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.output_name }}" \
            --codec=h264 \
            --crf="${{ inputs.crf }}" \
            --image-format=jpeg \
            --jpeg-quality=95 \
            --x264-preset=fast \
            --concurrency=4 \
            --timeout=90000

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: video-engine/out/${{ inputs.output_name }}
          retention-days: 7
